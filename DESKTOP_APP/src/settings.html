<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan DIMI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      padding: 24px;
      height: 100vh;
      overflow: hidden;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #f8fafc;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .info-label {
      color: #94a3b8;
    }

    .info-value {
      font-weight: 500;
      color: #f1f5f9;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-text {
      flex: 1;
    }

    /* Switch toggle */
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }

    .toggle-label {
      font-size: 15px;
      color: #e2e8f0;
    }
    
    .toggle-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Button */
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #2563eb; }
    button:disabled { background-color: #475569; cursor: not-allowed; color: #94a3b8; }

    .loader {
      border: 3px solid #334155;
      border-top: 3px solid #60a5fa;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Pengaturan Update</h1>
  
  <div class="card">
    <div class="info-row">
      <span class="info-label">Versi Aplikasi Saat Ini</span>
      <span class="info-value" id="current-version">Memuat...</span>
    </div>
    
    <div class="status-box">
      <div class="loader" id="update-loader"></div>
      <div class="status-text" id="update-status">Memeriksa pembaruan...</div>
      <button id="btn-update" style="display: none;">Perbarui Sekarang</button>
    </div>
  </div>

  <div class="card">
    <div class="toggle-container" style="border-top: none; margin-top: 0; padding-top: 0;">
      <div>
        <div class="toggle-label">Otomatis Perbarui Saat Ditutup</div>
        <div class="toggle-desc">Sistem akan otomatis mengunduh versi terbaru dan menginstalnya saat Anda keluar dari aplikasi.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="auto-update-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
