<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIMI - Starting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 56px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .spinner-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #334155;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 14px;
      color: #64748b;
    }

    .status-detail {
      font-size: 11px;
      color: #475569;
      margin-top: 8px;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    .version {
      position: fixed;
      bottom: 16px;
      right: 20px;
      font-size: 11px;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">DIMI</div>
    <div class="subtitle">Data Information & Management Imigrasi</div>
    
    <div class="spinner-container">
      <div class="spinner"></div>
      <div class="status">Memulai server<span class="dots"></span></div>
    </div>
    <div class="status-detail">Menjalankan PHP & Laravel di background</div>
  </div>

  <div class="version">v0.1.0</div>
</body>
</html>
